<app-home></app-home>

<div>
  <router-outlet></router-outlet>
</div>

@if (notification.message()) {
  <div class="notification-container position-fixed top-0 end-0 p-3">
    <div
      class="toast align-items-center border-0 show"
      [class.text-bg-success]="notification.type() === 'success'"
      [class.text-bg-danger]="notification.type() === 'danger'"
      role="alert"
      aria-live="assertive"
      aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">{{ notification.message() }}</div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          aria-label="Close"
          (click)="notification.dismiss()">
        </button>
      </div>
    </div>
  </div>
}
