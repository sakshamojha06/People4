<div class="add-person-container">

    <h2>Add New Person</h2>

    @if (errorMessage) {
        <div class="alert alert-danger">
            {{ errorMessage }}
        </div>
    }

    <form (ngSubmit)="addPerson()">

        <div class="form-group">
            <label>Name *</label>

            <input
                type="text"
                class="form-control"
                name="name"
                [(ngModel)]="person.name"
                placeholder="Enter name"
                required>
        </div>

        <div class="form-group">
            <label>Date of Birth *</label>

            <input
                type="date"
                class="form-control"
                name="dateOfBirth"
                [(ngModel)]="person.dateOfBirth"
                required>
        </div>

        <div class="form-group">
            <label>Gender *</label>

            <div class="mt-2">
                <label class="me-4">
                    <input type="radio" name="gender"
                        value="Male" [(ngModel)]="person.gender">
                    Male
                </label>

                <label class="me-4">
                    <input type="radio" name="gender"
                        value="Female" [(ngModel)]="person.gender">
                    Female
                </label>

                <label>
                    <input type="radio" name="gender"
                        value="Other" [(ngModel)]="person.gender">
                    Other
                </label>
            </div>
        </div>

        <div class="form-actions">
            <button type="button"
                class="btn btn-secondary me-2"
                (click)="goBack()">
                Cancel
            </button>

            <button type="submit" class="btn btn-success">
                <i class="bi bi-check-lg"></i>
                Save
            </button>
        </div>

    </form>
</div>
