
<div class="edit-person-container">

    <h2>Edit Person</h2>

    @if (errorMessage) {
        <div class="alert alert-danger">
            {{ errorMessage }}
        </div>
    }

    <form (ngSubmit)="updatePerson()">

        <div class="form-group">
            <label>Name *</label>

            <input
                type="text"
                class="form-control"
                name="name"
                [(ngModel)]="person.name"
                placeholder="Enter name"
                required>
        </div>

        <div class="form-group">
            <label>Date of Birth *</label>

            <input
                type="date"
                class="form-control"
                name="dateOfBirth"
                [(ngModel)]="person.dateOfBirth"
                required>
        </div>

        <div class="form-group">
            <label>Gender *</label>

            <div class="gender-options">

                <label>
                    <input
                        type="radio"
                        name="gender"
                        value="Male"
                        [(ngModel)]="person.gender">
                    Male
                </label>

                <label>
                    <input
                        type="radio"
                        name="gender"
                        value="Female"
                        [(ngModel)]="person.gender">
                    Female
                </label>

                <label>
                    <input
                        type="radio"
                        name="gender"
                        value="Other"
                        [(ngModel)]="person.gender">
                    Other
                </label>

            </div>
        </div>

        <div class="form-actions">

            <button
                type="button"
                class="btn btn-secondary me-2"
                (click)="goBack()">
                Cancel
            </button>

            <button
                type="submit"
                class="btn btn-primary">
                <i class="bi bi-pencil-square"></i>
                Update
            </button>

        </div>

    </form>
</div>
